<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Igre: školski ekran</title>
<style>
@font-face { font-family: "Lato"; font-weight: 400; src: url("../../druga-perspektiva/assets/fonts/lato-400.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 700; src: url("../../druga-perspektiva/assets/fonts/lato-700.woff2") format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-style: italic; src: url("../../druga-perspektiva/assets/fonts/source-serif-4-italic.woff2") format("woff2"); }

:root {
	--plava: #5271fe;
	--plava-chip: #3b57e8;
	--narandza: #ee8031;
	--tinta: #141414;
}

* { box-sizing: border-box; }

body { margin: 0; background: #888; font-family: "Lato", sans-serif; }

/* 16:9, 1920 × 1080. Isti izgled kao Instagram story; kvadratići kao u svesci (kao stranica Igre). */
.slide {
	position: relative;
	width: 1920px;
	height: 1080px;
	overflow: hidden;
	background-color: var(--plava);
	background-image:
		linear-gradient(rgba(255, 255, 255, 0.13) 2px, transparent 2px),
		linear-gradient(90deg, rgba(255, 255, 255, 0.13) 2px, transparent 2px);
	background-size: 64px 64px;
	background-position: -2px -2px;
	color: #fff;
}

.main {
	display: grid;
	grid-template-columns: 1fr 560px;
	align-items: center;
	gap: 90px;
	height: 930px;
	padding: 0 120px;
}

.tiles { display: flex; gap: 24px; }

.tile {
	display: grid;
	place-items: center;
	width: 210px;
	height: 210px;
	border: 7px solid var(--tinta);
	border-radius: 22px;
	background: #fff;
	box-shadow: 0 12px 0 var(--tinta);
	color: var(--tinta);
	font-size: 120px;
	font-weight: 700;
}
.tile:nth-child(1) { transform: rotate(-4deg); }
.tile:nth-child(2) { transform: rotate(3deg) translateY(14px); background: var(--narandza); }
.tile:nth-child(3) { transform: rotate(-2deg); }
.tile:nth-child(4) { transform: rotate(5deg) translateY(-8px); }

h1 {
	margin: 70px 0 0;
	font-size: 112px;
	font-weight: 700;
	line-height: 1.02;
	letter-spacing: -0.01em;
}

/* Imena igara na bijelim pločicama, isto kao slova i QR. */
.games { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 56px; }
.games span {
	padding: 16px 30px 20px;
	border: 5px solid var(--tinta);
	border-radius: 16px;
	background: #fff;
	box-shadow: 0 8px 0 var(--tinta);
	color: var(--tinta);
	font-size: 50px;
	font-weight: 700;
	line-height: 1;
}

/* QR kao naljepnica, malo nakrivljen. */
.qr {
	padding: 40px 46px 44px;
	border: 7px solid var(--tinta);
	border-radius: 30px;
	background: #fff;
	box-shadow: 0 14px 0 var(--tinta);
	color: var(--tinta);
	text-align: center;
	transform: rotate(2deg);
}
.qr b { display: block; margin-bottom: 30px; font-size: 62px; line-height: 1; }
.qr img { display: block; width: 100%; height: auto; }

/* Crna traka dolje, kao podnožje sajta. */
.bar {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	display: flex;
	align-items: center;
	justify-content: space-between;
	height: 150px;
	padding: 0 120px;
	background: var(--tinta);
}
.bar p { margin: 0; font-size: 46px; }
.bar p b { font-weight: 700; }
.bar em { font-family: "Source Serif 4", serif; font-size: 44px; color: rgba(255, 255, 255, 0.8); }
.bar img { height: 104px; filter: invert(1); }
.bar .left { display: flex; align-items: center; gap: 44px; }
</style>
</head>
<body>
<section class="slide" id="ekran">
	<div class="main">
		<div>
			<div class="tiles"><span class="tile">I</span><span class="tile">G</span><span class="tile">R</span><span class="tile">E</span></div>
			<h1>Svaki dan nova zagonetka.</h1>
			<div class="games"><span>Riječ dana</span><span>Kontekst</span><span>Ljestve</span></div>
		</div>
		<div class="qr">
			<b>Skeniraj i igraj</b>
			<img src="qr-igre.svg" alt="QR kod za drugaperspektiva.org/igre">
		</div>
	</div>
	<div class="bar">
		<div class="left">
			<img src="../../logo/Untitled_design_14-removebg-preview.png" alt="Druga perspektiva">
			<p><b>drugaperspektiva.org/igre</b></p>
		</div>
		<em>Za veliki odmor i put do kuće.</em>
	</div>
</section>
</body>
</html>
