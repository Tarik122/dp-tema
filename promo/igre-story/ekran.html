<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Igre: školski ekran</title>
<style>
@font-face { font-family: "Lato"; font-weight: 400; src: url("../../druga-perspektiva/assets/fonts/lato-400.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 700; src: url("../../druga-perspektiva/assets/fonts/lato-700.woff2") format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-style: italic; src: url("../../druga-perspektiva/assets/fonts/source-serif-4-italic.woff2") format("woff2"); }

:root {
	--plava: #5271fe;
	--narandza: #ee8031;
	--tinta: #141414;
}

* { box-sizing: border-box; }

body { margin: 0; background: #888; font-family: "Lato", sans-serif; }

/* 16:9, 1920 × 1080. Isti izgled kao Instagram story. */
.slide {
	position: relative;
	display: grid;
	grid-template-columns: 1fr 580px;
	align-items: center;
	gap: 100px;
	width: 1920px;
	height: 1080px;
	padding: 0 120px;
	overflow: hidden;
	background: var(--plava);
	color: #fff;
}

.chip {
	display: inline-block;
	padding: 10px 26px 14px;
	background: var(--tinta);
	color: #fff;
	font-size: 56px;
	font-weight: 700;
	line-height: 1;
}

h1 {
	margin: 36px 0 0;
	font-size: 124px;
	font-weight: 700;
	line-height: 1.02;
	letter-spacing: -0.01em;
}

.dek {
	margin: 30px 0 0;
	font-family: "Source Serif 4", serif;
	font-style: italic;
	font-size: 52px;
	line-height: 1.25;
}

.tiles { display: flex; gap: 18px; margin-top: 60px; }

.tile {
	display: grid;
	place-items: center;
	width: 150px;
	height: 150px;
	border: 5px solid var(--tinta);
	border-radius: 16px;
	background: #fff;
	box-shadow: 0 8px 0 var(--tinta);
	color: var(--tinta);
	font-size: 80px;
	font-weight: 700;
}
.tile:nth-child(1) { transform: rotate(-4deg); }
.tile:nth-child(2) { transform: rotate(3deg) translateY(10px); background: var(--narandza); }
.tile:nth-child(3) { transform: rotate(-2deg); }
.tile:nth-child(4) { transform: rotate(5deg) translateY(-6px); }

.games { margin: 56px 0 0; font-size: 46px; font-weight: 700; }

/* QR na bijeloj kartici, s crnim okvirom kao pločice u igrama. */
.qr {
	padding: 50px 50px 40px;
	border: 6px solid var(--tinta);
	border-radius: 28px;
	background: #fff;
	box-shadow: 0 12px 0 var(--tinta);
	color: var(--tinta);
	text-align: center;
}
.qr img { display: block; width: 100%; height: auto; }
.qr b { display: block; margin-top: 34px; font-size: 58px; line-height: 1; }
.qr span { display: block; margin-top: 14px; font-size: 32px; }

.logo {
	position: absolute;
	right: 120px;
	bottom: 36px;
	width: 110px;
	filter: invert(1);
}
</style>
</head>
<body>
<section class="slide" id="ekran">
	<div>
		<span class="chip">Igre</span>
		<h1>Svaki dan nova zagonetka.</h1>
		<p class="dek">Za veliki odmor i put do kuće.</p>
		<div class="tiles"><span class="tile">I</span><span class="tile">G</span><span class="tile">R</span><span class="tile">E</span></div>
		<p class="games">Riječ dana, Kontekst i Ljestve</p>
	</div>
	<div class="qr">
		<img src="qr-igre.svg" alt="QR kod za drugaperspektiva.org/igre">
		<b>Skeniraj i igraj</b>
		<span>drugaperspektiva.org/igre</span>
	</div>
	<img class="logo" src="../../logo/Untitled_design_14-removebg-preview.png" alt="">
</section>
</body>
</html>
