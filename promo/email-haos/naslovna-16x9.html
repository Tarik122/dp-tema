<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>DP: Digitalni haos (naslovna 16:9)</title>
<!--
	Statična naslovna 16:9 za članak „Digitalni haos u školskim klupama“.
	Komponovana ilustracija (ne simulacija): gomila mailova u tri dubine
	(mutna pozadina, oštra sredina, mutan prvi plan), nekoliko mailova još pada odozgo,
	a jedini važan mail (rok za zadaću, narandžasta tačka) napola je zatrpan u gomili.
	Lijevo gore ostaje prazan prostor. render-16x9.mjs pravi PNG (2x).
-->
<style>
@font-face { font-family: "Lato"; font-weight: 400; src: url("../../dp-objave/assets/fonts/lato-400.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 700; src: url("../../dp-objave/assets/fonts/lato-700.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { background: #777; font-family: "Lato", sans-serif; }
.slide { position: relative; overflow: hidden; width: 1920px; height: 1080px; background: #402f65; }
canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<section class="slide" id="slide"><canvas id="far" style="filter: blur(3px)"></canvas><canvas id="c"></canvas><canvas id="near" style="filter: blur(9px)"></canvas><canvas id="zrno"></canvas></section>
<script>
(function () {
	var W = 1920, H = 1080, BG = '#402f65';
	var dpr = window.devicePixelRatio || 1;
	// Tri sloja: daleki i bliski su zamućeni CSS filterom (brže od zamućenja u canvasu).
	var layers = {};
	['far', 'c', 'near', 'zrno'].forEach(function (id) { var el = document.getElementById(id); el.width = W * dpr; el.height = H * dpr; layers[id] = el.getContext('2d'); });
	var cv = document.getElementById('c'), ctx = layers.c;

	var seed = 7;
	function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

	var MAILS = [
		['Anketa iz sociologije', 'Google forma'],
		['Digital design anketa', 'Google forma'],
		['Poziv na volontiranje', 'Prijave za akciju u subotu'],
		['Anketa za projekat iz geografije', 'Google forma'],
		['Upitnik za završni rad iz psihologije', 'Google forma'],
		['Digital design anketa', 'Podsjetnik: anketa se zatvara danas'],
		['Anketa iz sociologije', 'Još samo 20 odgovora nedostaje!'],
		['Poziv na volontiranje', 'Trebamo još pet volontera'],
		['Istraživanje o navikama spavanja', 'Google forma'],
		['Anketa za projekat iz geografije', 'Podsjetnik']
	];
	var VAZNO = ['Classroom', 'Rok za predaju zadaće: danas do 23:59'];
	var CW = 600, CH = 124, R = 14;
	var mi = 0, minute = 9 * 60 + 47;
	function next() {
		var m = MAILS[mi++ % MAILS.length];
		return { from: m[0], subj: m[1], time: fmt(7 * 60 + 5 + Math.floor(rnd() * 150)) };
	}
	function fmt(n) { var h = Math.floor(n / 60), m = n % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }

	function rr(x, y, w, h, r) {
		ctx.beginPath();
		ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
		ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
		ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
		ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
	}
	function fit(text, max) {
		if (ctx.measureText(text).width <= max) return text;
		while (text.length && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
		return text.replace(/\s+$/, '') + '…';
	}

	// c: { x, y, a (rad), s (veličina), blur (px), fog (0–1: koliko se stapa s pozadinom), mail, vazno }
	function card(c) {
		var L = -CW / 2, T = -CH / 2, k = c.s * dpr;
		ctx.save();
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		ctx.translate(c.x, c.y);
		ctx.rotate(c.a);
		ctx.scale(c.s, c.s);
		// sjena: široka meka + uska tik uz karticu, obje u tamnoj ljubičastoj
		rr(L, T, CW, CH, R);
		ctx.shadowColor = 'rgba(18, 8, 40, ' + (0.5 * (1 - c.fog * 0.6)) + ')';
		ctx.shadowBlur = 70 * k; ctx.shadowOffsetY = 34 * k;
		ctx.fillStyle = '#fbfaff'; ctx.fill();
		ctx.shadowColor = 'rgba(18, 8, 40, ' + (0.28 * (1 - c.fog * 0.6)) + ')';
		ctx.shadowBlur = 10 * k; ctx.shadowOffsetY = 4 * k;
		ctx.fill();
		ctx.shadowColor = 'transparent';
		ctx.fillStyle = c.vazno ? '#ee8031' : '#402f65';
		ctx.beginPath(); ctx.arc(L + 38, T + 44, 8.5, 0, Math.PI * 2); ctx.fill();
		ctx.textBaseline = 'alphabetic';
		ctx.fillStyle = 'rgba(20,20,20,.48)'; ctx.font = '400 24px Lato'; ctx.textAlign = 'right';
		ctx.fillText(c.mail.time, CW / 2 - 30, T + 54);
		ctx.textAlign = 'left';
		ctx.fillStyle = '#141414'; ctx.font = '700 34px Lato';
		if (ctx.measureText(c.mail.from).width > CW - 190) ctx.font = '700 29px Lato';
		ctx.fillText(fit(c.mail.from, CW - 190), L + 64, T + 56);
		ctx.fillStyle = 'rgba(20,20,20,.62)'; ctx.font = '400 28px Lato';
		ctx.fillText(fit(c.mail.subj, CW - 96), L + 64, T + 98);
		// magla: daleke kartice se stapaju s pozadinom
		if (c.fog) { rr(L - 2, T - 2, CW + 4, CH + 4, R); ctx.fillStyle = 'rgba(64,47,101,' + c.fog + ')'; ctx.fill(); }
		ctx.restore();
	}

	// Oblik gomile: visina iznad donje ivice za dati x (vrh desno od sredine).
	function mound(x, peak, cx, wid) { return peak * Math.exp(-Math.pow((x - cx) / wid, 2)); }

	function scene() {
		var list = [], i, x, h;
		// 1) daleki sloj: mutna gomila iza glavne (bez "magle", samo manja, mutnija i malo tamnija)
		for (i = 0; i < 26; i++) {
			x = 200 + rnd() * 1800; h = mound(x, 640, 1300, 760);
			list.push({ x: x, y: H + 20 - rnd() * h, a: (rnd() - 0.5) * 0.7, s: 0.56, blur: 3, fog: 0.22, mail: next() });
		}
		// 2) nekoliko dalekih mailova u padu, raspoređenih uz mlaz
		[[1180, 150, -0.3], [1880, 470, 0.28], [760, 330, 0.18]].forEach(function (q) {
			list.push({ x: q[0], y: q[1], a: q[2], s: 0.56, blur: 3, fog: 0.18, mail: next() });
		});
		// 3) glavna gomila: šira i viša, popunjava donje dvije trećine
		var mid = [];
		for (i = 0; i < 40; i++) {
			x = -60 + rnd() * 2080; h = mound(x, 600, 1120, 760);
			mid.push({ x: x, y: H + 40 - rnd() * h, a: (rnd() - 0.5) * 0.6, s: 0.86, mail: next() });
		}
		mid.sort(function (a, b) { return b.y - a.y; });
		list = list.concat(mid);
		// važni mail, napola zatrpan
		list.push({ x: 820, y: 935, a: -0.06, s: 0.86, mail: { from: VAZNO[0], subj: VAZNO[1], time: '07:15' }, vazno: true });
		list.push({ x: 1290, y: 952, a: 0.07, s: 0.86, mail: { from: 'Digital design anketa', subj: 'Podsjetnik: anketa se zatvara danas', time: '09:41' } });
		// vrh gomile
		list.push({ x: 1250, y: 560, a: 0.12, s: 0.86, mail: { from: 'Digital design anketa', subj: 'Google forma', time: '09:44' } });
		list.push({ x: 960, y: 640, a: -0.2, s: 0.86, mail: { from: 'Poziv na volontiranje', subj: 'Prijave za akciju u subotu', time: '09:45' } });
		list.push({ x: 1140, y: 470, a: -0.05, s: 0.86, mail: { from: 'Anketa iz sociologije', subj: 'Google forma', time: '09:47' } });
		// 4) mlaz oštrih mailova koji upravo padaju na vrh gomile (gore desno prema sredini)
		list.push({ x: 1720, y: 40, a: 0.5, s: 0.86, mail: { from: 'Istraživanje o navikama spavanja', subj: 'Google forma', time: '09:50' } });
		list.push({ x: 1560, y: 215, a: 0.32, s: 0.86, mail: { from: 'Anketa za projekat iz geografije', subj: 'Google forma', time: '09:48' } });
		list.push({ x: 1320, y: 330, a: -0.14, s: 0.86, mail: { from: 'Poziv na volontiranje', subj: 'Trebamo još pet volontera', time: '09:49' } });
		// 5) prvi plan: dvije velike, jako mutne kartice uokviruju kadar
		list.push({ x: 180, y: 1075, a: 0.12, s: 1.4, blur: 12, mail: next() });
		return list;
	}

	function grain() {
		var n = 140, g = document.createElement('canvas'); g.width = g.height = n;
		var gx = g.getContext('2d'), img = gx.createImageData(n, n);
		for (var i = 0; i < n * n; i++) { var v = rnd() < 0.5 ? 0 : 255; img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 4; }
		gx.putImageData(img, 0, 0);
		ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.fillStyle = ctx.createPattern(g, 'repeat'); ctx.fillRect(0, 0, cv.width, cv.height);
		ctx.restore();
	}

	function draw() {
		seed = 7; mi = 0; minute = 9 * 60 + 47;
		scene().forEach(function (c) {
			c.blur = c.blur || 0; c.fog = c.fog || 0;
			ctx = c.blur > 6 ? layers.near : c.blur > 0 ? layers.far : layers.c;
			card(c);
		});
		ctx = layers.zrno; grain();
	}

	window.dp = { frames: 1, step: draw };
	draw();
})();
</script>
</body>
</html>
