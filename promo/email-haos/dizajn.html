<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>DP: Digitalni haos (animirani cover)</title>
<!--
	Animirani cover za članak „Digitalni haos u školskim klupama“.
	Mailovi padaju u inbox sve brže (fizika: matter-js) dok se inbox ne prenatrpa.
	render.mjs korak po korak crta sličice i od njih pravi MP4 (30 fps) i PNG zadnje sličice.
-->
<style>
@font-face { font-family: "Lato"; font-weight: 400; src: url("../../dp-objave/assets/fonts/lato-400.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 700; src: url("../../dp-objave/assets/fonts/lato-700.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 900; src: url("../../dp-objave/assets/fonts/lato-900.woff2") format("woff2"); }

:root { --narandza: #ee8031; --tinta: #141414; --ljubicasta: #402f65; }
* { box-sizing: border-box; margin: 0; }
body { background: #777; font-family: "Lato", sans-serif; color: #fff; }

.slide { position: relative; overflow: hidden; width: 1080px; height: 1440px; background: var(--ljubicasta); }
canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1440px; }

/* Naslov na istoj ljubičastoj pozadini; kartice ne silaze ispod nevidljivog poda (y = 1000). */
.panel { position: absolute; left: 0; right: 0; top: 1035px; height: 405px; padding: 0 64px; }
.oznaka {
	display: inline-block; padding: 0 0.45em; height: 1.45em; line-height: 1.45em;
	font-size: 38px; font-weight: 700; color: #fff; background: var(--narandza); white-space: nowrap;
}
.naslov { margin-top: 20px; font-size: 90px; font-weight: 700; line-height: 1.03; letter-spacing: -0.022em; max-width: 860px; }
.dek { margin-top: 22px; font-size: 40px; line-height: 1.3; color: rgba(255,255,255,.84); }
.logo { position: absolute; right: 64px; top: -6px; width: 100px; }
</style>
</head>
<body>

<section class="slide post" id="slide">
	<canvas id="c"></canvas>
	<div class="panel">
		<span class="oznaka" id="brojac">0 nepročitanih poruka</span>
		<h1 class="naslov">Digitalni haos u&nbsp;školskim klupama</h1>
		<p class="dek">Treba li nam bolja organizacija e-mailova?</p>
		<img class="logo" src="../../dp-objave/assets/logo-bijeli.png" alt="">
	</div>
</section>

<script src="matter.min.js"></script>
<script>
(function () {
	var W = 1080, H = 1440, FPS = 30, FLOOR = 1000;
	var dpr = window.devicePixelRatio || 1;
	var cv = document.getElementById('c'), ctx = cv.getContext('2d');
	cv.width = W * dpr; cv.height = H * dpr;

	var seed = 20261109;
	function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

	var MAILS = [
		['Classroom', 'Nova zadaća: Hemija'],
		['Anketa', 'Upitnik za završni rad iz psihologije'],
		['Profesorica matematike', 'Test se pomjera za četvrtak'],
		['Vijeće učenika', 'Molba za učešće u istraživanju'],
		['Classroom', 'Nova tema: teorija za ponedjeljak'],
		['Anketa', 'Podsjetnik: upitnik se zatvara danas'],
		['Sekretarijat', 'Promjena rasporeda časova'],
		['Volontiranje', 'Prijave za akciju u subotu'],
		['Anketa', 'Upitnik o korištenju društvenih mreža'],
		['Classroom', 'Rok za predaju: 23:59'],
		['Anketa', 'Molimo vas da odvojite pet minuta'],
		['Classroom', 'Dodatni zadaci za vikend'],
		['Anketa', 'Istraživanje o navikama spavanja'],
		['Profesor fizike', 'Prezentacije sa današnjeg časa'],
		['Anketa', 'Još samo 20 odgovora nedostaje!'],
		['Classroom', 'Novi komentar na zadaću']
	];

	var M = Matter, engine = M.Engine.create({ positionIterations: 20, velocityIterations: 14 });
	engine.gravity.y = 0;
	// Nevidljivi pod: kartice nikad ne prekrivaju naslov.
	M.Composite.add(engine.world, M.Bodies.rectangle(W / 2, FLOOR + 1000, W * 4, 2000, { isStatic: true, restitution: 0.4 }));

	// Raspored: prvi mailovi rijetko, onda sve gušće.
	var spawns = [], t = 0.35, gap = 0.85;
	while (t < 7.2) { spawns.push(t); t += gap; gap = Math.max(0.12, gap * 0.86); }

	var CW = 860, CH = 180, R = 18, CX = W / 2, CY = 470, LEAD = 4; // LEAD: sličice od udarca do pojave kartice
	var cards = [], labels = [], track = [], made = 0, blasts = 0, frame = 0, minute = 7 * 60 + 2;

	// Udarac iz sredine: postojeće kartice odlete u stranu i otvore mjesto novoj.
	function blast() {
		var k = blasts / Math.max(1, spawns.length - 1);
		var P = 12 + 11 * k;
		cards.forEach(function (b) {
			if (b.gone) return;
			var dx = b.position.x - CX, dy = b.position.y - CY, d = Math.hypot(dx, dy);
			if (d < 1) { var a = rnd() * Math.PI * 2; dx = Math.cos(a); dy = Math.sin(a); d = 1; }
			var f = P / (1 + d / 380);
			M.Body.setVelocity(b, { x: b.velocity.x + dx / d * f * 1.15, y: b.velocity.y + dy / d * f });
			M.Body.setAngularVelocity(b, b.angularVelocity + (rnd() - 0.5) * f * 0.006);
		});
		blasts++;
	}

	function spawn() {
		var m = MAILS[made % MAILS.length];
		var late = made > 8;
		var b = M.Bodies.rectangle(CX + (rnd() - 0.5) * 60, CY + (rnd() - 0.5) * 40, CW, CH, {
			chamfer: { radius: R }, restitution: 0.45, friction: 0.1, frictionAir: 0.075, density: 0.002
		});
		M.Body.setAngle(b, made === 0 ? 0 : (rnd() - 0.5) * (late ? 0.6 : 0.3));
		b.born = frame; b.idx = made;
		minute += 1 + Math.floor(rnd() * (late ? 3 : 9));
		var hh = Math.floor(minute / 60) % 24, mm = minute % 60;
		b.mail = { from: m[0], subj: m[1], time: (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm };
		M.Composite.add(engine.world, b);
		cards.push(b);
		made++;
	}

	// Pojava: brzo naraste s malim preskokom (ease-out-back).
	function pop(age) {
		var n = 9;
		if (age >= n) return 1;
		var x = age / n, c = 2.2;
		return 0.35 + 0.65 * (1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2));
	}

	// Blago privlačenje prema sredini: gomila ostaje u kadru dok ne postane pretijesno.
	function pull() {
		cards.forEach(function (b) {
			if (b.gone) return;
			var k = 2.6e-6 * b.mass;
			M.Body.applyForce(b, b.position, { x: (CX - b.position.x) * k, y: (CY - b.position.y) * k });
		});
	}
	function cull() {
		cards.forEach(function (b) {
			if (!b.gone && (Math.abs(b.position.x - CX) > 1700 || Math.abs(b.position.y - CY) > 1700)) {
				M.Composite.remove(engine.world, b); b.gone = true;
			}
		});
	}

	function shown(n) {
		var N = spawns.length;
		if (n < 4) return n;
		return Math.round(n + 1100 * Math.pow((n - 4) / (N - 4), 3));
	}
	function label(n) {
		if (n > 999) return '999+ nepročitanih poruka';
		var a = n % 10, b = n % 100;
		if (a === 1 && b !== 11) return n + ' nepročitana poruka';
		if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return n + ' nepročitane poruke';
		return n + ' nepročitanih poruka';
	}

	function rr(c, x, y, w, h, r) {
		c.beginPath();
		c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
		c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
		c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
		c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
	}
	function fitc(c, text, max) {
		if (c.measureText(text).width <= max) return text;
		while (text.length && c.measureText(text + '…').width > max) text = text.slice(0, -1);
		return text.replace(/\s+$/, '') + '…';
	}

	// Jedna kartica; px = koliko pravih piksela ima jedan piksel dizajna (za sjenu).
	function drawCard(c, b, px) {
		var g = b.g;
		c.save();
		c.translate(b.x, b.y);
		c.rotate(b.angle);
		c.scale(g, g);
		rr(c, -CW / 2, -CH / 2, CW, CH, R);
		c.shadowColor = 'rgba(16, 8, 36, 0.42)';
		c.shadowBlur = 44 * px * g;
		c.shadowOffsetY = 18 * px * g;
		c.fillStyle = '#ffffff'; c.fill();
		c.shadowColor = 'transparent';
		var L = -CW / 2, T = -CH / 2;
		c.fillStyle = '#402f65';
		c.beginPath(); c.arc(L + 46, T + 60, 10, 0, Math.PI * 2); c.fill();
		c.textBaseline = 'alphabetic';
		c.fillStyle = 'rgba(20,20,20,.5)'; c.font = '400 30px Lato'; c.textAlign = 'right';
		c.fillText(b.mail.time, CW / 2 - 40, T + 72);
		c.textAlign = 'left';
		c.fillStyle = '#141414'; c.font = '700 44px Lato';
		c.fillText(fitc(c, b.mail.from, CW - 260), L + 80, T + 75);
		c.fillStyle = 'rgba(20,20,20,.68)'; c.font = '400 36px Lato';
		c.fillText(fitc(c, b.mail.subj, CW - 120), L + 80, T + 132);
		c.restore();
	}

	function view(b) { return { x: b.position.x, y: b.position.y, angle: b.angle, g: pop(frame - b.born), mail: b.mail }; }

	function draw() {
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		ctx.fillStyle = '#402f65';
		ctx.fillRect(0, 0, W, H);
		cards.forEach(function (b) { if (!b.gone) drawCard(ctx, view(b), dpr); });
	}

	function record() {
		cards.forEach(function (b) {
			var tr = track[b.idx] || (track[b.idx] = { mail: b.mail, k: [] });
			if (b.gone) return;
			var v = view(b);
			tr.k.push([frame, +v.x.toFixed(1), +v.y.toFixed(1), +(v.angle * 180 / Math.PI).toFixed(2), +(v.g * 100).toFixed(2)]);
		});
	}

	var queue = [];
	function step() {
		var time = frame / FPS;
		while (blasts < spawns.length && spawns[blasts] <= time) { blast(); queue.push(frame + LEAD); }
		while (queue.length && queue[0] <= frame) { queue.shift(); spawn(); }
		for (var k = 0; k < 4; k++) { pull(); M.Engine.update(engine, 1000 / 120); }
		cull();
		frame++;
		var lab = label(shown(made));
		document.getElementById('brojac').textContent = lab;
		if (!labels.length || labels[labels.length - 1][1] !== lab) labels.push([frame, lab]);
		record();
		draw();
	}

	window.dp = {
		frames: Math.round(8.8 * FPS),
		step: function (n) { for (var i = 0; i < (n || 1); i++) step(); },
		count: function () { return made; },
		track: function () { return track; },
		labels: function () { return labels; },
		cardPng: function (i) {
			var tr = track[i], pad = 70, s = 2;
			var c = document.createElement('canvas');
			c.width = (CW + 2 * pad) * s; c.height = (CH + 2 * pad) * s;
			var x = c.getContext('2d'); x.scale(s, s);
			drawCard(x, { x: CW / 2 + pad, y: CH / 2 + pad, angle: 0, g: 1, mail: tr.mail }, s);
			return c.toDataURL('image/png');
		}
	};
	document.getElementById('brojac').textContent = label(0);
	draw();
})();
</script>
</body>
</html>
