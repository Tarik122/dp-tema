<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>DP: Digitalni haos (animirani cover)</title>
<!--
	Animirani cover za članak „Digitalni haos u školskim klupama“.
	Mailovi padaju u inbox sve brže (fizika: matter-js) dok se inbox ne prenatrpa.
	render.mjs korak po korak crta sličice i od njih pravi MP4 (30 fps) i PNG zadnje sličice.
-->
<style>
@font-face { font-family: "Lato"; font-weight: 400; src: url("../../dp-objave/assets/fonts/lato-400.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 700; src: url("../../dp-objave/assets/fonts/lato-700.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 900; src: url("../../dp-objave/assets/fonts/lato-900.woff2") format("woff2"); }

:root {
	--narandza: #ee8031;
	--tinta: #141414;
	--ljubicasta: #402f65;
	--svijetla: #ebebee;
}
* { box-sizing: border-box; margin: 0; }
body { background: #777; font-family: "Lato", sans-serif; color: #fff; padding: 0; }

.slide { position: relative; overflow: hidden; width: 1080px; height: 1440px; background: var(--svijetla); }
canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 900px; }

.panel { position: absolute; left: 0; right: 0; top: 900px; bottom: 0; background: var(--ljubicasta); padding: 72px 64px 0 64px; }
.oznaka {
	display: inline-block; padding: 0 0.45em; height: 1.45em; line-height: 1.45em;
	font-size: 38px; font-weight: 700; color: #fff; background: var(--narandza); white-space: nowrap;
	font-variant-numeric: tabular-nums;
}
.naslov { margin-top: 22px; font-size: 90px; font-weight: 700; line-height: 1.03; letter-spacing: -0.022em; max-width: 900px; }
.dek { margin-top: 26px; font-size: 40px; line-height: 1.3; color: rgba(255,255,255,.84); }
.logo { position: absolute; right: 64px; top: 66px; width: 100px; }
</style>
</head>
<body>

<section class="slide post" id="slide">
	<canvas id="c"></canvas>
	<div class="panel">
		<span class="oznaka" id="brojac">0 nepročitanih poruka</span>
		<h1 class="naslov">Digitalni haos u&nbsp;školskim klupama</h1>
		<p class="dek">Treba li nam bolja organizacija e-mailova?</p>
		<img class="logo" src="../../dp-objave/assets/logo-bijeli.png" alt="">
	</div>
</section>

<script src="matter.min.js"></script>
<script>
(function () {
	var W = 1080, H = 900, FPS = 30;
	var dpr = window.devicePixelRatio || 1;
	var cv = document.getElementById('c'), ctx = cv.getContext('2d');
	cv.width = W * dpr; cv.height = H * dpr;

	// Ponovljiva nasumičnost (isti video svaki put).
	var seed = 20261109;
	function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

	var MAILS = [
		['Classroom', 'Nova zadaća: Hemija'],
		['Anketa', 'Upitnik za završni rad iz psihologije'],
		['Profesorica matematike', 'Test se pomjera za četvrtak'],
		['Vijeće učenika', 'Molba za učešće u istraživanju'],
		['Classroom', 'Nova tema: teorija za ponedjeljak'],
		['Anketa', 'Podsjetnik: upitnik se zatvara danas'],
		['Sekretarijat', 'Promjena rasporeda časova'],
		['Volontiranje', 'Prijave za akciju u subotu'],
		['Anketa', 'Upitnik o korištenju društvenih mreža'],
		['Classroom', 'Rok za predaju: 23:59'],
		['Anketa', 'Molimo vas da odvojite pet minuta'],
		['Classroom', 'Dodatni zadaci za vikend'],
		['Anketa', 'Istraživanje o navikama spavanja'],
		['Profesor fizike', 'Prezentacije sa današnjeg časa'],
		['Anketa', 'Još samo 20 odgovora nedostaje!'],
		['Classroom', 'Novi komentar na zadaću']
	];

	var M = Matter, engine = M.Engine.create({ positionIterations: 24, velocityIterations: 16 });
	engine.gravity.y = 1.15;
	engine.enableSleeping = true;
	var wallOpt = { isStatic: true, friction: 0.6 };
	M.Composite.add(engine.world, [
		M.Bodies.rectangle(W / 2, H + 1000, W * 3, 2000, wallOpt),       // pod (vrh ljubičastog panela)
		M.Bodies.rectangle(-1000, -2000, 2000, 6000, wallOpt),           // lijevi zid
		M.Bodies.rectangle(W + 1000, -2000, 2000, 6000, wallOpt)         // desni zid
	]);

	// Raspored dolazaka: prvi mailovi rijetko, onda sve gušće.
	var spawns = [], t = 0.3, gap = 0.75;
	while (t < 7.4) { spawns.push(t); t += gap; gap = Math.max(0.045, gap * 0.85); }

	var cards = [], made = 0, frame = 0, minute = 7 * 60 + 2;
	var CW = 470, CH = 112;

	function spawn() {
		var m = MAILS[made % MAILS.length];
		var late = made > 18;
		var x = 240 + rnd() * (W - 480);
		var b = M.Bodies.rectangle(x, -CH - rnd() * (late ? 900 : 200), CW, CH, {
			chamfer: { radius: 14 }, restitution: 0.12, friction: 0.45, frictionAir: 0.004, density: 0.002
		});
		M.Body.setAngle(b, made === 0 ? 0.02 : (rnd() - 0.5) * (late ? 1.1 : 0.5));
		M.Body.setVelocity(b, { x: (rnd() - 0.5) * (late ? 10 : 3), y: late ? 4 + rnd() * 5 : 2 });
		M.Body.setAngularVelocity(b, (rnd() - 0.5) * (late ? 0.12 : 0.03));
		minute += 1 + Math.floor(rnd() * (late ? 2 : 9));
		var hh = Math.floor(minute / 60) % 24, mm = minute % 60;
		b.mail = { from: m[0], subj: m[1], time: (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm };
		M.Composite.add(engine.world, b);
		cards.push(b);
		made++;
	}

	function shown(n) {
		// Brojač raste brže od broja kartica i dođe do 999+ tek na samom kraju.
		var N = spawns.length;
		if (n < 6) return n;
		return Math.round(n + 1100 * Math.pow((n - 6) / (N - 6), 3.2));
	}
	function label(n) {
		if (n > 999) return '999+ nepročitanih poruka';
		var a = n % 10, b = n % 100;
		if (a === 1 && b !== 11) return n + ' nepročitana poruka';
		if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return n + ' nepročitane poruke';
		return n + ' nepročitanih poruka';
	}

	function rr(x, y, w, h, r) {
		ctx.beginPath();
		ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
		ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
		ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
		ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
	}
	function fit(text, max) {
		if (ctx.measureText(text).width <= max) return text;
		while (text.length && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
		return text.replace(/\s+$/, '') + '…';
	}

	function draw() {
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		ctx.fillStyle = '#ebebee';
		ctx.fillRect(0, 0, W, H);
		cards.forEach(function (b) {
			if (b.position.y < -CH * 1.5) return;
			ctx.save();
			ctx.translate(b.position.x, b.position.y);
			ctx.rotate(b.angle);
			rr(-CW / 2, -CH / 2, CW, CH, 14);
			ctx.fillStyle = '#ffffff'; ctx.fill();
			ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(20,20,20,.16)'; ctx.stroke();
			// tačka nepročitanog
			ctx.fillStyle = '#402f65';
			ctx.beginPath(); ctx.arc(-CW / 2 + 30, -CH / 2 + 38, 7, 0, Math.PI * 2); ctx.fill();
			ctx.textBaseline = 'alphabetic';
			ctx.fillStyle = 'rgba(20,20,20,.5)'; ctx.font = '400 22px Lato'; ctx.textAlign = 'right';
			ctx.fillText(b.mail.time, CW / 2 - 26, -CH / 2 + 46);
			ctx.textAlign = 'left';
			ctx.fillStyle = '#141414'; ctx.font = '700 28px Lato';
			ctx.fillText(fit(b.mail.from, CW - 160), -CW / 2 + 52, -CH / 2 + 47);
			ctx.fillStyle = 'rgba(20,20,20,.66)'; ctx.font = '400 25px Lato';
			ctx.fillText(fit(b.mail.subj, CW - 78), -CW / 2 + 52, -CH / 2 + 86);
			ctx.restore();
		});
	}

	function step() {
		var time = frame / FPS;
		while (made < spawns.length && spawns[made] <= time) spawn();
		for (var k = 0; k < 4; k++) M.Engine.update(engine, 1000 / 120);
		frame++;
		document.getElementById('brojac').textContent = label(shown(made));
		draw();
	}

	window.dp = {
		frames: Math.round(8.8 * FPS),
		step: function (n) { for (var i = 0; i < (n || 1); i++) step(); },
		count: function () { return made; }
	};
	document.getElementById('brojac').textContent = label(0);
	draw();
})();
</script>
</body>
</html>
