<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>DP: Digitalni haos (animirani cover)</title>
<!--
	Animirani cover za članak „Digitalni haos u školskim klupama“.
	Mailovi padaju u inbox sve brže (fizika: matter-js) dok se inbox ne prenatrpa.
	render.mjs korak po korak crta sličice i od njih pravi MP4 (30 fps) i PNG zadnje sličice.
-->
<style>
@font-face { font-family: "Lato"; font-weight: 400; src: url("../../dp-objave/assets/fonts/lato-400.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 700; src: url("../../dp-objave/assets/fonts/lato-700.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 900; src: url("../../dp-objave/assets/fonts/lato-900.woff2") format("woff2"); }

:root {
	--narandza: #ee8031;
	--tinta: #141414;
	--ljubicasta: #402f65;
	--svijetla: #ebebee;
}
* { box-sizing: border-box; margin: 0; }
body { background: #777; font-family: "Lato", sans-serif; color: #fff; padding: 0; }

.slide { position: relative; overflow: hidden; width: 1080px; height: 1440px; background: var(--svijetla); }
canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 900px; }

.panel { position: absolute; left: 0; right: 0; top: 900px; bottom: 0; background: var(--ljubicasta); padding: 72px 64px 0 64px; }
.oznaka {
	display: inline-block; padding: 0 0.45em; height: 1.45em; line-height: 1.45em;
	font-size: 38px; font-weight: 700; color: #fff; background: var(--narandza); white-space: nowrap;
	font-variant-numeric: tabular-nums;
}
.naslov { margin-top: 22px; font-size: 90px; font-weight: 700; line-height: 1.03; letter-spacing: -0.022em; max-width: 900px; }
.dek { margin-top: 26px; font-size: 40px; line-height: 1.3; color: rgba(255,255,255,.84); }
.logo { position: absolute; right: 64px; top: 66px; width: 100px; }
</style>
</head>
<body>

<section class="slide post" id="slide">
	<canvas id="c"></canvas>
	<div class="panel">
		<span class="oznaka" id="brojac">0 nepročitanih poruka</span>
		<h1 class="naslov">Digitalni haos u&nbsp;školskim klupama</h1>
		<p class="dek">Treba li nam bolja organizacija e-mailova?</p>
		<img class="logo" src="../../dp-objave/assets/logo-bijeli.png" alt="">
	</div>
</section>

<script src="matter.min.js"></script>
<script>
(function () {
	var W = 1080, H = 900, FPS = 30;
	var dpr = window.devicePixelRatio || 1;
	var cv = document.getElementById('c'), ctx = cv.getContext('2d');
	cv.width = W * dpr; cv.height = H * dpr;

	// Ponovljiva nasumičnost (isti video svaki put).
	var seed = 20261109;
	function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

	var MAILS = [
		['Classroom', 'Nova zadaća: Hemija'],
		['Anketa', 'Upitnik za završni rad iz psihologije'],
		['Profesorica matematike', 'Test se pomjera za četvrtak'],
		['Vijeće učenika', 'Molba za učešće u istraživanju'],
		['Classroom', 'Nova tema: teorija za ponedjeljak'],
		['Anketa', 'Podsjetnik: upitnik se zatvara danas'],
		['Sekretarijat', 'Promjena rasporeda časova'],
		['Volontiranje', 'Prijave za akciju u subotu'],
		['Anketa', 'Upitnik o korištenju društvenih mreža'],
		['Classroom', 'Rok za predaju: 23:59'],
		['Anketa', 'Molimo vas da odvojite pet minuta'],
		['Classroom', 'Dodatni zadaci za vikend'],
		['Anketa', 'Istraživanje o navikama spavanja'],
		['Profesor fizike', 'Prezentacije sa današnjeg časa'],
		['Anketa', 'Još samo 20 odgovora nedostaje!'],
		['Classroom', 'Novi komentar na zadaću']
	];

	var M = Matter, engine = M.Engine.create({ positionIterations: 24, velocityIterations: 16 });
	// Bez gravitacije: kartice plutaju kao na stolu viđenom odozgo.
	engine.gravity.y = 0;

	// Raspored dolazaka: prvi mailovi rijetko, onda sve gušće.
	var spawns = [], t = 0.3, gap = 0.7;
	while (t < 7.5) { spawns.push(t); t += gap; gap = Math.max(0.035, gap * 0.87); }

	var labels = [];
	var cards = [], made = 0, frame = 0, minute = 7 * 60 + 2;
	var CW = 470, CH = 112, CX = W / 2, CY = H / 2;
	var GROW = 0.12; // početna veličina nove kartice (dio pune veličine)

	function spawn() {
		var m = MAILS[made % MAILS.length];
		var late = made > 14;
		var b = M.Bodies.rectangle(CX + (rnd() - 0.5) * 260, CY + (rnd() - 0.5) * 90, CW, CH, {
			chamfer: { radius: 14 }, restitution: 0.3, friction: 0.2, frictionAir: 0.11, density: 0.002
		});
		M.Body.setAngle(b, made === 0 ? 0 : (rnd() - 0.5) * (late ? 1.4 : 0.8));
		// Nova kartica izraste iz sredine; dok raste, nepomična je i gura ostale.
		M.Body.scale(b, GROW, GROW);
		M.Body.setStatic(b, true);
		b.g = GROW; b.born = frame; b.idx = made;
		minute += 1 + Math.floor(rnd() * (late ? 2 : 9));
		var hh = Math.floor(minute / 60) % 24, mm = minute % 60;
		b.mail = { from: m[0], subj: m[1], time: (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm };
		M.Composite.add(engine.world, b);
		cards.push(b);
		made++;
	}

	function grow() {
		cards.forEach(function (b) {
			if (b.g >= 1) return;
			var g = Math.min(1, b.g * 1.09);
			M.Body.scale(b, g / b.g, g / b.g);
			b.g = g;
			if (g >= 1) {
				M.Body.setStatic(b, false);
				M.Body.setAngularVelocity(b, (rnd() - 0.5) * 0.06);
			}
		});
	}

	// Blago privlačenje prema sredini inboxa: kartice ostaju na gomili,
	// a iz kadra ispadaju tek kad postane pretijesno.
	function pull() {
		cards.forEach(function (b) {
			if (b.gone || b.isStatic) return;
			var k = 2.5e-6 * b.mass;
			M.Body.applyForce(b, b.position, { x: (CX - b.position.x) * k, y: (CY - b.position.y) * k * 1.3 });
		});
	}

	// Kartice daleko izvan kadra izbacujemo iz simulacije (ostaju zapamćene za AE).
	function cull() {
		cards.forEach(function (b) {
			if (b.gone) return;
			if (Math.abs(b.position.x - CX) > 1500 || Math.abs(b.position.y - CY) > 1500) {
				M.Composite.remove(engine.world, b); b.gone = true;
			}
		});
	}

	function shown(n) {
		// Brojač raste brže od broja kartica i dođe do 999+ tek na samom kraju.
		var N = spawns.length;
		if (n < 6) return n;
		return Math.round(n + 1100 * Math.pow((n - 6) / (N - 6), 3.2));
	}
	function label(n) {
		if (n > 999) return '999+ nepročitanih poruka';
		var a = n % 10, b = n % 100;
		if (a === 1 && b !== 11) return n + ' nepročitana poruka';
		if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return n + ' nepročitane poruke';
		return n + ' nepročitanih poruka';
	}

	function rr(x, y, w, h, r) {
		ctx.beginPath();
		ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
		ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
		ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
		ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
	}
	function fit(text, max) {
		if (ctx.measureText(text).width <= max) return text;
		while (text.length && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
		return text.replace(/\s+$/, '') + '…';
	}

	function drawCard(c, b) {
		var g = b.g || 1;
		c.save();
		c.translate(b.x, b.y);
		c.rotate(b.angle);
		c.scale(g, g);
		var save = ctx; ctx = c;
		rr(-CW / 2, -CH / 2, CW, CH, 14);
		ctx = save;
		c.fillStyle = '#ffffff'; c.fill();
		c.lineWidth = 2; c.strokeStyle = 'rgba(20,20,20,.16)'; c.stroke();
		c.fillStyle = '#402f65';
		c.beginPath(); c.arc(-CW / 2 + 30, -CH / 2 + 38, 7, 0, Math.PI * 2); c.fill();
		c.textBaseline = 'alphabetic';
		c.fillStyle = 'rgba(20,20,20,.5)'; c.font = '400 22px Lato'; c.textAlign = 'right';
		c.fillText(b.mail.time, CW / 2 - 26, -CH / 2 + 46);
		c.textAlign = 'left';
		c.fillStyle = '#141414'; c.font = '700 28px Lato';
		c.fillText(fitc(c, b.mail.from, CW - 160), -CW / 2 + 52, -CH / 2 + 47);
		c.fillStyle = 'rgba(20,20,20,.66)'; c.font = '400 25px Lato';
		c.fillText(fitc(c, b.mail.subj, CW - 78), -CW / 2 + 52, -CH / 2 + 86);
		c.restore();
	}
	function fitc(c, text, max) {
		if (c.measureText(text).width <= max) return text;
		while (text.length && c.measureText(text + '…').width > max) text = text.slice(0, -1);
		return text.replace(/\s+$/, '') + '…';
	}

	function draw() {
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		ctx.fillStyle = '#ebebee';
		ctx.fillRect(0, 0, W, H);
		cards.forEach(function (b) {
			if (b.gone) return;
			drawCard(ctx, { x: b.position.x, y: b.position.y, angle: b.angle, g: b.g, mail: b.mail });
		});
	}

	// Stanje svih kartica u trenutnoj sličici (za After Effects skriptu).
	var track = [];
	function record() {
		cards.forEach(function (b) {
			var tr = track[b.idx] || (track[b.idx] = { born: b.born, mail: b.mail, k: [] });
			if (b.gone) return;
			tr.k.push([frame, +b.position.x.toFixed(1), +b.position.y.toFixed(1), +(b.angle * 180 / Math.PI).toFixed(2), +(b.g * 100).toFixed(2)]);
		});
	}

	function step() {
		var time = frame / FPS;
		while (made < spawns.length && spawns[made] <= time) spawn();
		for (var k = 0; k < 4; k++) { grow(); pull(); M.Engine.update(engine, 1000 / 120); }
		cull();
		frame++;
		var lab = label(shown(made));
		document.getElementById('brojac').textContent = lab;
		if (!labels.length || labels[labels.length - 1][1] !== lab) labels.push([frame, lab]);
		record();
		draw();
	}

	window.dp = {
		frames: Math.round(8.8 * FPS),
		step: function (n) { for (var i = 0; i < (n || 1); i++) step(); },
		count: function () { return made; },
		track: function () { return track; },
		labels: function () { return labels; },
		// Jedna kartica kao PNG s providnom pozadinom (2x), za After Effects / Newton.
		cardPng: function (i) {
			var tr = track[i], pad = 6, s = 2;
			var c = document.createElement('canvas');
			c.width = (CW + 2 * pad) * s; c.height = (CH + 2 * pad) * s;
			var x = c.getContext('2d'); x.scale(s, s);
			drawCard(x, { x: CW / 2 + pad, y: CH / 2 + pad, angle: 0, g: 1, mail: tr.mail });
			return c.toDataURL('image/png');
		}
	};
	document.getElementById('brojac').textContent = label(0);
	draw();
})();
</script>
</body>
</html>
