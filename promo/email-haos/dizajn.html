<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>DP: Digitalni haos (animirani cover)</title>
<!--
	Animirani cover u stilu naslovnica rubrike Mišljenje (ljubičasta pozadina, oznaka i naslov gore,
	ravna ilustracija na liniji dolje). Ilustracija su mailovi: svaki novi iskoči u sredini i odgurne
	ostale, sve brže, dok se prostor ne prenatrpa. Fizika: matter-js. render.mjs pravi MP4 i PNG.
	Ime autora: upiši ga u AUTOR ispod (prazno = podnaslov umjesto "Piše:").
-->
<style>
@font-face { font-family: "Lato"; font-weight: 400; src: url("../../dp-objave/assets/fonts/lato-400.woff2") format("woff2"); }
@font-face { font-family: "Lato"; font-weight: 700; src: url("../../dp-objave/assets/fonts/lato-700.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
body { background: #777; font-family: "Lato", sans-serif; color: #fff; }
.slide { position: relative; overflow: hidden; width: 1080px; height: 1440px; background: #402f65; }
canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1440px; }
.gore { position: absolute; left: 96px; right: 96px; top: 120px; }
.oznaka { display: inline-block; padding: 0 0.45em; height: 1.45em; line-height: 1.45em; font-size: 38px; font-weight: 700; color: #fff; background: #141414; }
.naslov { margin-top: 30px; font-size: 100px; font-weight: 700; line-height: 1.03; letter-spacing: -0.022em; }
.pise { margin-top: 30px; font-size: 40px; line-height: 1.3; color: rgba(255,255,255,.72); }
.pise b { color: #fff; font-weight: 700; }
.brojac { position: absolute; left: 96px; bottom: 90px; font-size: 30px; color: rgba(255,255,255,.82); font-variant-numeric: tabular-nums; }
.logo { position: absolute; right: 64px; bottom: 72px; width: 100px; }
</style>
</head>
<body>

<section class="slide post" id="slide">
	<canvas id="c"></canvas>
	<div class="gore">
		<span class="oznaka">Mišljenje</span>
		<h1 class="naslov">Digitalni haos u&nbsp;školskim klupama</h1>
		<p class="pise" id="pise"></p>
	</div>
	<p class="brojac" id="brojac"></p>
	<img class="logo" src="../../dp-objave/assets/logo-bijeli.png" alt="">
</section>

<script src="matter.min.js"></script>
<script>
(function () {
	var AUTOR = ''; // npr. 'Ime Prezime'
	document.getElementById('pise').innerHTML = AUTOR ? 'Piše: <b>' + AUTOR + '</b>' : 'Treba li nam bolja organizacija e-mailova?';

	var W = 1080, H = 1440, FPS = 30, FLOOR = 1198, CEIL = 560;
	var dpr = window.devicePixelRatio || 1;
	var cv = document.getElementById('c'), ctx = cv.getContext('2d');
	cv.width = W * dpr; cv.height = H * dpr;

	var seed = 20261109;
	function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

	var MAILS = [
		['Classroom', 'Nova zadaća: Hemija'],
		['Anketa', 'Upitnik za završni rad iz psihologije'],
		['Profesorica matematike', 'Test se pomjera za četvrtak'],
		['Vijeće učenika', 'Molba za učešće u istraživanju'],
		['Classroom', 'Nova tema: teorija za ponedjeljak'],
		['Anketa', 'Podsjetnik: upitnik se zatvara danas'],
		['Sekretarijat', 'Promjena rasporeda časova'],
		['Volontiranje', 'Prijave za akciju u subotu'],
		['Anketa', 'Upitnik o korištenju društvenih mreža'],
		['Classroom', 'Rok za predaju: 23:59'],
		['Anketa', 'Molimo vas da odvojite pet minuta'],
		['Classroom', 'Dodatni zadaci za vikend'],
		['Anketa', 'Istraživanje o navikama spavanja'],
		['Profesor fizike', 'Prezentacije sa današnjeg časa'],
		['Anketa', 'Još samo 20 odgovora nedostaje!'],
		['Classroom', 'Novi komentar na zadaću']
	];

	// Boje kao na ilustracijama rubrike Mišljenje: bijela, dvije lila, tinta i jedna narandžasta.
	var SKIN = {
		w: { bg: '#ffffff', ink: '#141414', soft: 'rgba(20,20,20,.62)', dot: '#402f65' },
		l: { bg: '#dcd8e6', ink: '#141414', soft: 'rgba(20,20,20,.62)', dot: '#402f65' },
		m: { bg: '#b3acc6', ink: '#141414', soft: 'rgba(20,20,20,.66)', dot: '#402f65' },
		t: { bg: '#141414', ink: '#ffffff', soft: 'rgba(255,255,255,.7)', dot: '#ffffff' },
		o: { bg: '#ee8031', ink: '#ffffff', soft: 'rgba(255,255,255,.88)', dot: '#ffffff' }
	};
	var ORDER = 'wwlwtwomwlwwtmwlwwtowmwlwtw';

	var M = Matter, engine = M.Engine.create({ positionIterations: 20, velocityIterations: 14 });
	engine.gravity.y = 0;
	M.Composite.add(engine.world, [
		M.Bodies.rectangle(W / 2, FLOOR + 1000, W * 4, 2000, { isStatic: true, restitution: 0.35 }), // linija (pod)
		M.Bodies.rectangle(W / 2, CEIL - 1000, W * 4, 2000, { isStatic: true, restitution: 0.2 })    // nevidljiva granica ispod naslova
	]);

	var spawns = [], t = 0.35, gap = 0.85;
	while (t < 7.2) { spawns.push(t); t += gap; gap = Math.max(0.12, gap * 0.86); }

	var CW = 700, CH = 146, R = 16, CX = W / 2, CY = 880, LEAD = 4;
	var cards = [], made = 0, blasts = 0, frame = 0, minute = 7 * 60 + 2;

	// Udarac iz sredine: postojeće kartice odlete u stranu i otvore mjesto novoj.
	function blast() {
		var k = blasts / Math.max(1, spawns.length - 1);
		var P = 12 + 11 * k;
		cards.forEach(function (b) {
			if (b.gone) return;
			var dx = b.position.x - CX, dy = b.position.y - CY, d = Math.hypot(dx, dy);
			if (d < 1) { var a = rnd() * Math.PI * 2; dx = Math.cos(a); dy = Math.sin(a); d = 1; }
			var f = P / (1 + d / 380);
			M.Body.setVelocity(b, { x: b.velocity.x + dx / d * f * 1.2, y: b.velocity.y + dy / d * f * 0.8 });
			M.Body.setAngularVelocity(b, b.angularVelocity + (rnd() - 0.5) * f * 0.006);
		});
		blasts++;
	}

	function spawn() {
		var m = MAILS[made % MAILS.length];
		var late = made > 8;
		var b = M.Bodies.rectangle(CX + (rnd() - 0.5) * 60, CY + (rnd() - 0.5) * 40, CW, CH, {
			chamfer: { radius: R }, restitution: 0.45, friction: 0.1, frictionAir: 0.075, density: 0.002
		});
		M.Body.setAngle(b, made === 0 ? 0 : (rnd() - 0.5) * (late ? 0.6 : 0.3));
		b.born = frame;
		b.skin = SKIN[ORDER.charAt(made % ORDER.length)];
		minute += 1 + Math.floor(rnd() * (late ? 3 : 9));
		var hh = Math.floor(minute / 60) % 24, mm = minute % 60;
		b.mail = { from: m[0], subj: m[1], time: (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm };
		M.Composite.add(engine.world, b);
		cards.push(b);
		made++;
	}

	// Pojava: brzo naraste s malim preskokom.
	function pop(age) {
		var n = 9;
		if (age >= n) return 1;
		var x = age / n, c = 2.2;
		return 0.35 + 0.65 * (1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2));
	}

	// Privlačenje prema dnu sredine: gomila leži na liniji i ostaje u kadru dok ne postane pretijesno.
	function pull() {
		cards.forEach(function (b) {
			if (b.gone) return;
			var k = 2.6e-6 * b.mass;
			M.Body.applyForce(b, b.position, { x: (CX - b.position.x) * k, y: (FLOOR - 120 - b.position.y) * k * 1.6 });
		});
	}
	function cull() {
		cards.forEach(function (b) {
			if (!b.gone && Math.abs(b.position.x - CX) > 1500) { M.Composite.remove(engine.world, b); b.gone = true; }
		});
	}

	function shown(n) {
		var N = spawns.length;
		if (n < 4) return n;
		return Math.round(n + 1100 * Math.pow((n - 4) / (N - 4), 3));
	}
	function label(n) {
		if (n > 999) return '999+ nepročitanih poruka';
		var a = n % 10, b = n % 100;
		if (a === 1 && b !== 11) return n + ' nepročitana poruka';
		if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return n + ' nepročitane poruke';
		return n + ' nepročitanih poruka';
	}

	function rr(c, x, y, w, h, r) {
		c.beginPath();
		c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
		c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
		c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
		c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
	}
	function fit(text, max) {
		if (ctx.measureText(text).width <= max) return text;
		while (text.length && ctx.measureText(text + '…').width > max) text = text.slice(0, -1);
		return text.replace(/\s+$/, '') + '…';
	}

	function drawCard(b) {
		var g = pop(frame - b.born), s = b.skin, L = -CW / 2, T = -CH / 2;
		ctx.save();
		ctx.translate(b.position.x, b.position.y);
		ctx.rotate(b.angle);
		ctx.scale(g, g);
		rr(ctx, L, T, CW, CH, R);
		ctx.fillStyle = s.bg; ctx.fill();
		ctx.fillStyle = s.dot;
		ctx.beginPath(); ctx.arc(L + 40, T + 50, 8, 0, Math.PI * 2); ctx.fill();
		ctx.textBaseline = 'alphabetic';
		ctx.fillStyle = s.soft; ctx.font = '400 25px Lato'; ctx.textAlign = 'right';
		ctx.fillText(b.mail.time, CW / 2 - 34, T + 60);
		ctx.textAlign = 'left';
		ctx.fillStyle = s.ink; ctx.font = '700 36px Lato';
		ctx.fillText(fit(b.mail.from, CW - 220), L + 66, T + 62);
		ctx.fillStyle = s.soft; ctx.font = '400 29px Lato';
		ctx.fillText(fit(b.mail.subj, CW - 100), L + 66, T + 108);
		ctx.restore();
	}

	function draw() {
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		ctx.fillStyle = '#402f65';
		ctx.fillRect(0, 0, W, H);
		cards.forEach(function (b) { if (!b.gone) drawCard(b); });
		// Ispod linije malo tamnije, kao na ostalim naslovnicama rubrike.
		ctx.fillStyle = '#35275a';
		ctx.fillRect(0, FLOOR, W, H - FLOOR);
		ctx.fillStyle = 'rgba(255,255,255,.34)';
		ctx.fillRect(0, FLOOR - 1, W, 2);
	}

	var queue = [];
	function step() {
		var time = frame / FPS;
		while (blasts < spawns.length && spawns[blasts] <= time) { blast(); queue.push(frame + LEAD); }
		while (queue.length && queue[0] <= frame) { queue.shift(); spawn(); }
		for (var k = 0; k < 4; k++) { pull(); M.Engine.update(engine, 1000 / 120); }
		cull();
		frame++;
		document.getElementById('brojac').textContent = label(shown(made));
		draw();
	}

	window.dp = {
		frames: Math.round(8.8 * FPS),
		step: function (n) { for (var i = 0; i < (n || 1); i++) step(); }
	};
	document.getElementById('brojac').textContent = label(0);
	draw();
})();
</script>
</body>
</html>
